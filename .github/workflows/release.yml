name: Release

# Builds, tests, and publishes the stable "dgf" package to PyPI for Linux
# (x86_64) and macOS (arm64). The version is `__version__` in dgf/__init__.py.
#
# Usage: Update `__version__` (and CHANGELOG.md) in google3, wait for the
# change to be exported to main, then: Actions > Release > "Run workflow". The
# wheels are only built (and kept as workflow artifacts) unless "publish" is
# checked.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the wheels to PyPI (otherwise, only build them).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build-release${{ matrix.os == 'macos-15' && '-macos' || '' }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # All the platforms and Python versions are built even if one fails (to
      # see all the failures), but nothing is published unless all of them
      # succeed.
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-15"]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions must be pinned to a commit hash (Google GitHub org policy).
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Build, test, and Bazel cache handling (shared with ci.yml and
      # nightly.yml).
      - name: Build and test the package
        uses: ./.github/actions/build-and-test
        with:
          python-version: ${{ matrix.python-version }}

      # Only the repaired wheels are published: auditwheel (manylinux) on
      # Linux, and delocate (macosx) on macOS.
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            dist/*manylinux*.whl
            dist/*macosx*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Releases are only published from main.
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The PyPI trusted publisher of "dgf" is bound to this workflow file and to
    # this GitHub environment.
    environment: pypi
    permissions:
      # PyPI Trusted Publishing (OIDC): no API token is stored on GitHub.
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List wheels
        run: ls -l dist

      # Fails if the version is already published (i.e. `__version__` was not
      # updated).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
