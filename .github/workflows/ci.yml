name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions must be pinned to a commit hash (Google GitHub org policy).
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # A single-version build needs >15GB (Python venv with torch/tensorflow,
      # Bazel cache, and Docker image), which exceeds the free space of a
      # standard runner. Remove pre-installed toolchains that are not needed.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      # Cache of the build container's /root/.cache: Bazel output base and
      # repository cache (compiled C++ dependencies, test results), and
      # bazelisk. The pip cache is not saved (see below). Restored from the latest run for this Python version,
      # even if the dependencies changed since: Bazel and pip only reuse what
      # is still valid, and script/test.sh invalidates the cached test results
      # when the installed Python packages change.
      - name: Restore build cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dgf-cache
          key: dgf-cache-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dgf-cache-${{ matrix.python-version }}-

      - name: Build and Test Package
        env:
          PYVERSION: ${{ matrix.python-version }}
          # An absolute path is bind-mounted (instead of a Docker volume).
          BAZEL_CACHE: ${{ runner.temp }}/dgf-cache
        run: ./script/build_pip_package.sh "${PYVERSION}"

      - name: Disk usage
        if: always()
        run: df -h /

      # The cache is written by root in the container, and must be readable by
      # the runner user to be saved. The pip wheels (~3GB) are not saved: they
      # are quick to download, and the repository cache quota (10GB) must fit
      # the caches of the three Python versions.
      - name: Prepare build cache for saving
        if: always()
        env:
          CACHE_DIR: ${{ runner.temp }}/dgf-cache
        run: |
          if [ -d "${CACHE_DIR}" ]; then
            sudo rm -rf "${CACHE_DIR}/pip"
            sudo chown -R "$(id -u):$(id -g)" "${CACHE_DIR}"
            sudo du -sh "${CACHE_DIR}"/* "${CACHE_DIR}"
          fi

      # Saved even if the build failed, so that the next run does not have to
      # recompile everything.
      - name: Save build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dgf-cache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
