site_name: Distributed Graph Flow
site_description: >-
  Build, train, evaluate, and deploy Graph Neural Networks on tabular,
  relational, and temporal data with JAX.
site_url: https://dgf.readthedocs.io/
use_directory_urls: false
repo_url: https://github.com/google/distributed_graph_flow
repo_name: google/distributed_graph_flow
copyright: Copyright &copy; Google LLC. Licensed under the Apache License 2.0.

theme:
  name: material
  custom_dir: overrides
  favicon: image/icon_128.png
  logo: image/icon_128.png
  font:
    text: Roboto
  icon:
    repo: fontawesome/brands/github
  features:
    - search.suggest
    - search.highlight
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode


extra_css:
  - style/extra.css

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true   # Shows the "Download Notebook" button
      execute: false         # Set to 'true' if you want MkDocs to run the cells during build
      ignore: ["*.md"]
  - gen-files:
      scripts:
        - copy_external.py
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true 
            show_root_full_path: true
            show_signature: false
            show_root_heading: false
            show_bases: true
            show_source: false

strict: false

nav:
  - 🏡 Home: index.md
  - 🧭 Getting started: tutorial/getting_started_simple_api.ipynb
  - 🔥 Advanced API: tutorial/getting_started_advanced_api.ipynb
  - 🐜 API: api.md
  - ❔ Q&A: qna.md
  - 📖 Examples: https://github.com/google/distributed_graph_flow/tree/main/examples
  - 🤸 For Googlers: http://go/graph-flow
  - Simple API:
    - Tasks:
      - Node model: tutorial/node_prediction.ipynb
      - Link model: tutorial/link_prediction.ipynb
    - Input features:
      - Timeseries: tutorial/timeseries_node_prediction.ipynb
  - Advanced API:
    - In-memory graph: tutorial/in_memory_graph.ipynb
    - In-process Sampler: tutorial/sampler.ipynb
    - Offline Distributed Sampler (GCP): tutorial/gcp_offline_distributed_sampler.ipynb
    - Normalizers: tutorial/normalizer.ipynb
  - Guides:
    -   Graph file format: file_formats.md
    -   Graph in-memory objects: graph_formats.md
  - Changelog: changelog.md

extra:
  analytics:
    provider: google
    property: G-B6NFSCCG1B
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/google/distributed_graph_flow
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dgf/
      name: PyPI
    - icon: fontawesome/solid/envelope
      link: mailto:distributed-graph-flow-contact@google.com
      name: Contact the team

watch:
  - ../CHANGELOG.md
