# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_install:
      - pip install --no-deps .
    build:
      html:
        # Wrap mkdocs in a timeout with SIGABRT and faulthandler to get a python traceback if it hangs
        - timeout -s SIGABRT 120s python3 -X faulthandler -m mkdocs build --verbose --clean --site-dir $READTHEDOCS_OUTPUT/html --config-file doc/mkdocs.yml

mkdocs:
   configuration: doc/mkdocs.yml

python:
  install:
    - requirements: doc/requirements.txt